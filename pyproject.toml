[project]
name = "mypylogger"
dynamic = ["version"]
description = "Zero-dependency structured JSON logging for Python, with sensible defaults."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen Abbot", email = "stephen.abbot@denverbytes.com" }]
maintainers = [{ name = "Stephen Abbot", email = "stephen.abbot@denverbytes.com" }]
keywords = [
    "logging",
    "json",
    "structured-logging",
    "zero-dependency",
    "json-formatter",
    "observability",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/stephenabbot/mypylogger"
Repository = "https://github.com/stephenabbot/mypylogger"
Issues = "https://github.com/stephenabbot/mypylogger/issues"
Changelog = "https://github.com/stephenabbot/mypylogger/blob/main/CHANGELOG.md"
Documentation = "https://github.com/stephenabbot/mypylogger/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mypylogger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mypylogger"]

[dependency-groups]
dev = [
    "build>=1.0.0",
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=mypylogger",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["mypylogger"]
branch = true
parallel = true
sigterm = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["mypylogger"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]
